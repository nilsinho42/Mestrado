version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=object_detection
      - ML_SERVICE_URL=http://ml-service:8000
      - ENV=development
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080
        - VITE_WS_URL=ws://localhost:8080
        - VITE_APP_TITLE=Cloud Object Detection Dashboard
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

  ml-service:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ml:/app
      - ./ml/uploads:/app/uploads
      - ./ml/data:/app/data
      - ./cloud/gcp/dulcet-voyager-316217-4413d1f83430.json:/app/credentials/dulcet-voyager-316217-4413d1f83430.json
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/dulcet-voyager-316217-4413d1f83430.json
    env_file:
      - .env
    networks:
      - app-network
    restart: always
    command: "python -c \"import sys; sys.path.append('/app'); from api import app; import uvicorn; uvicorn.run(app, host='0.0.0.0', port=8000, log_level='info')\""

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=object_detection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: