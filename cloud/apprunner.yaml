version: 1.0
runtime: python311

build:
  pre-build:
    - yum install -y mesa-libGL glib2
  commands:
    build:
      - echo "Skipping build, using runtime install"      
run:
  runtime-version: 3.11
  pre-run:  
    - pip3 install --no-cache-dir -r requirements.txt
  command: python3 -m uvicorn tracker_app:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
